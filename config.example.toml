[root]
# Optional: advertise a specific IP (e.g. Tailscale) for dashboard links
self_ip = "100.64.0.10"

[nut]
  shutdown_threshold = 20  # Shutdown clients when battery below 20%
  startup_threshold = 50   # Start clients when battery above 50%
  bootstrap_retry_interval = "PT5M"  # Retry bootstrap every 5 minutes on failure

[[nut.managed_hardware]]
  name = "NAS"
  local_ip = "192.168.1.172"
  username = "root"

[[nut.managed_hardware]]
  name = "Dream Machine"
  local_ip = "192.168.1.1"
  username = "root"

[[endpoints.nas]]
  nickname = "unifi-nas"
  ip_address = "192.168.1.172"
  username = "root"
  password = "password"

[[endpoints.b2]]
  nickname = "b2-us"
  key_id = ""
  application_key = ""

# Optional remote-server ingestion. Paths are inside the Bungalo container;
# setup.sh already mounts the host's ~/.bungalo at /root/.bungalo.
# [[endpoints.sftp]]
#   nickname = "remote-server"
#   host = "server.example.com"
#   username = "backup"
#   port = 22
#   key_file = "/root/.bungalo/ssh/remote-server"
#   known_hosts_file = "/root/.bungalo/ssh/known_hosts"
#
# Put this pair before NAS -> B2 pairs so ingestion finishes first.
# [[backups.sync]]
#   src = "sftp:remote-server:///srv/data"
#   dst = "nas:unifi-nas://Common_Drive/remote-server"

[[backups.sync]]
  src = "nas:unifi-nas://Common_Drive"
  dst = "b2:b2-us://bungalo-nas-us/common_drive"

[iphoto]
  username = "your_username"
  password = "your_password"
  output_directory = "iphoto"

[media_server]
  plugin = "jellyfin"
  transcode = "nas:unifi-nas://Media/Transcode"

[[media_server.mounts]]
  name = "movies"
  path = "nas:unifi-nas://Media/Movies"
  container_path = "/data/movies"

[[media_server.mounts]]
  name = "tv"
  path = "nas:unifi-nas://Media/TV"

[home_assistant]
  enabled = true
  # port = 8123  # default Home Assistant port

# Optional: offer new videos on a Mac's /Volumes for upload to Studio via Slack.
# ssh_endpoint names an [[endpoints.sftp]] entry for that Mac.
# [media_ingest]
#   ssh_endpoint = "edit-mac"
#   studio_url = "https://studio.example.com"
#   volumes = ["CARD", "EOS_DIGITAL"]  # volume names to scan
#   interval = "PT5M"         # how often to SSH in and check /Volumes
#   reply_interval = "PT30S"  # how often to check Slack threads for comments
#
# Optional: convert each selected video on that Mac before uploading it.
# The template is a shell script on this server using "$INPUT" and "$OUTPUT".
# [media_ingest.transcode]
#   template = "/root/.bungalo/media_ingest/transcode.sh"
#   output_suffix = "_HQ.mp4"  # C0001.MOV uploads as C0001_HQ.mp4
#   work_dir = "/tmp/bungalo-media-ingest"  # needs room for the largest output
#   volumes = ["CARD"]  # only convert these; left out, every volume is converted
