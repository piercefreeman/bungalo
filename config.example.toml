[root]
# Optional: advertise a specific IP (e.g. Tailscale) for dashboard links
self_ip = "100.64.0.10"

[nut]
  shutdown_threshold = 20  # Shutdown clients when battery below 20%
  startup_threshold = 50   # Start clients when battery above 50%
  bootstrap_retry_interval = "PT5M"  # Retry bootstrap every 5 minutes on failure

[[nut.managed_hardware]]
  name = "NAS"
  local_ip = "192.168.1.172"
  username = "root"

[[nut.managed_hardware]]
  name = "Dream Machine"
  local_ip = "192.168.1.1"
  username = "root"

[[endpoints.nas]]
  nickname = "unifi-nas"
  ip_address = "192.168.1.172"
  username = "root"
  password = "password"

[[endpoints.b2]]
  nickname = "b2-us"
  key_id = ""
  application_key = ""

# Optional remote-server ingestion. Paths are inside the Bungalo container;
# setup.sh already mounts the host's ~/.bungalo at /root/.bungalo.
# [[endpoints.sftp]]
#   nickname = "remote-server"
#   host = "server.example.com"
#   username = "backup"
#   port = 22
#   key_file = "/root/.bungalo/ssh/remote-server"
#   known_hosts_file = "/root/.bungalo/ssh/known_hosts"
#
# Put this pair before NAS -> B2 pairs so ingestion finishes first.
# [[backups.sync]]
#   src = "sftp:remote-server:///srv/data"
#   dst = "nas:unifi-nas://Common_Drive/remote-server"

[[backups.sync]]
  src = "nas:unifi-nas://Common_Drive"
  dst = "b2:b2-us://bungalo-nas-us/common_drive"

[iphoto]
  username = "your_username"
  password = "your_password"
  output_directory = "iphoto"

[media_server]
  plugin = "jellyfin"
  transcode = "nas:unifi-nas://Media/Transcode"

[[media_server.mounts]]
  name = "movies"
  path = "nas:unifi-nas://Media/Movies"
  container_path = "/data/movies"

[[media_server.mounts]]
  name = "tv"
  path = "nas:unifi-nas://Media/TV"

[home_assistant]
  enabled = true
  # port = 8123  # default Home Assistant port
